plugins { id 'com.android.application' }

// номер сборки из GitHub Actions: растёт с каждым запуском, чтобы Android принимал обновление поверх старой версии
def runNumber = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
// Версия игры: МАЖОР.МИНОР задаётся здесь вручную (новая крупная версия - поменяй строку ниже),
// третье число - номер сборки из GitHub Actions. Пример: 0.1.7, 0.1.8 ... потом 0.2.9
def baseVersion = '0.1'

android {
    namespace 'com.bodycamclone'
    compileSdk 34
    defaultConfig {
        applicationId 'com.bodycamclone'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName baseVersion + '.' + runNumber
    }
    // Одна и та же подпись при каждой сборке: APK ставится как обновление, без удаления старой версии
    signingConfigs {
        debug {
            storeFile file('bodycam.keystore')
            storePassword 'bodycam'
            keyAlias 'bodycam'
            keyPassword 'bodycam'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }
    androidResources { noCompress 'glb', 'fbx' }
}
