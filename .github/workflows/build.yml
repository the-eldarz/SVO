name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          if [ -f BodycamClone.zip ]; then unzip -o BodycamClone.zip; fi
          mkdir -p app/src/main/assets/models
          # все модели .glb из корня репозитория (ukrainian_soldier.glb, russian_vdv_paratrooper.glb) кладём в assets
          for f in *.glb; do if [ -f "$f" ]; then cp -f "$f" app/src/main/assets/models/; fi; done
          echo "--- проект:"
          ls -la
          echo "--- модель:"
          ls -la app/src/main/assets/models/ || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: bodycam-apk
          path: app/build/outputs/apk/debug/*.apk
