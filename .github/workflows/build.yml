name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          if [ -f BodycamClone.zip ]; then unzip -o BodycamClone.zip; fi
          if [ -f ukrainian_soldier.glb ]; then
            mkdir -p app/src/main/assets/models
            cp ukrainian_soldier.glb app/src/main/assets/models/
          fi
          echo "--- проект:"
          ls -la
          echo "--- модель:"
          ls -la app/src/main/assets/models/ || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: bodycam-apk
          path: app/build/outputs/apk/debug/*.apk
